<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 监课系统 - 后台看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #070b14;
  --bg-surface: #0d1425;
  --bg-card: #111b33;
  --bg-elevated: #162040;
  --border: #1e2d52;
  --border-light: #2a3d6b;
  --text-primary: #e8edf5;
  --text-secondary: #8896b8;
  --text-muted: #5a6a8a;
  --accent: #00d4c8;
  --accent-glow: rgba(0,212,200,0.15);
  --accent-subtle: rgba(0,212,200,0.08);
  --green: #00d48a;
  --green-subtle: rgba(0,212,138,0.12);
  --amber: #f0b400;
  --amber-subtle: rgba(240,180,0,0.12);
  --red: #ff4757;
  --red-subtle: rgba(255,71,87,0.12);
  --blue: #4a7dff;
  --blue-subtle: rgba(74,125,255,0.1);
  --purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(0,212,200,0.04),transparent);pointer-events:none;z-index:0}

/* Layout */
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:32px 40px;min-height:100vh}
.page{display:none}.page.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
.header-left{display:flex;align-items:center;gap:16px}
.header-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0891b2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;box-shadow:0 0 20px var(--accent-glow)}
.header-title{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.header-title span{color:var(--text-muted);font-weight:400}
.header-date{font-size:13px;color:var(--text-secondary);background:var(--bg-card);padding:8px 16px;border-radius:20px;border:1px solid var(--border);display:flex;align-items:center;gap:8px}
.header-date i{font-style:normal;opacity:.6}

/* Stats Overview */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;position:relative;overflow:hidden;transition:var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.total::after{background:var(--accent)}
.stat-card.passed::after{background:var(--green)}
.stat-card.failed::after{background:var(--red)}
.stat-label{font-size:13px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.stat-value{font-size:42px;font-weight:800;font-family:var(--font-mono);letter-spacing:-1px;line-height:1}
.stat-card.total .stat-value{color:var(--accent)}
.stat-card.passed .stat-value{color:var(--green)}
.stat-card.failed .stat-value{color:var(--red)}
.stat-sub{font-size:12px;color:var(--text-muted);margin-top:6px}
.stat-icon{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:48px;opacity:.08;font-weight:800}

/* Section Header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.section-title .count{background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;padding:2px 10px;border-radius:10px;font-weight:500}
.filter-bar{display:flex;gap:10px}
.filter-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:var(--font)}
.filter-btn:hover{background:var(--bg-elevated);color:var(--text-primary)}
.filter-btn.active{background:var(--accent-subtle);border-color:var(--accent);color:var(--accent)}

/* Table */
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap th{text-align:left;padding:14px 20px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;background:var(--bg-surface);border-bottom:1px solid var(--border)}
.table-wrap td{padding:16px 20px;font-size:13px;border-bottom:1px solid rgba(30,45,82,0.4);vertical-align:middle}
.table-wrap tr:last-child td{border-bottom:none}
.table-wrap tr{transition:var(--transition)}
.table-wrap tr:hover{background:var(--accent-subtle)}

.score-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:6px;font-weight:700;font-family:var(--font-mono);font-size:14px}
.score-badge.pass{background:var(--green-subtle);color:var(--green)}
.score-badge.warn{background:var(--amber-subtle);color:var(--amber)}
.score-badge.fail{background:var(--red-subtle);color:var(--red)}
.score-badge .score-dot{width:6px;height:6px;border-radius:50%}
.score-badge.pass .score-dot{background:var(--green)}
.score-badge.warn .score-dot{background:var(--amber)}
.score-badge.fail .score-dot{background:var(--red)}

.status-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500}
.status-tag.normal{background:var(--green-subtle);color:var(--green)}
.status-tag.alert{background:var(--red-subtle);color:var(--red)}
.status-tag.warning{background:var(--amber-subtle);color:var(--amber)}

.btn-detail{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-secondary);padding:6px 16px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:var(--font);white-space:nowrap}
.btn-detail:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow)}

.btn-back{display:inline-flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:var(--font)}
.btn-back:hover{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-light)}

/* Detail Page */
.detail-header{margin-bottom:28px}
.detail-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.detail-session-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px}
.detail-info-item{display:flex;flex-direction:column;gap:4px}
.detail-info-item .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.detail-info-item .value{font-size:14px;font-weight:600;color:var(--text-primary)}
.detail-info-item .value.mono{font-family:var(--font-mono)}
.detail-score-large{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--font-mono);font-size:36px;font-weight:800}
.detail-score-large .score-unit{font-size:14px;font-weight:500;color:var(--text-muted);align-self:flex-end;margin-bottom:6px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg-surface);border-radius:10px;padding:4px;margin-bottom:24px;border:1px solid var(--border)}
.tab{flex:1;padding:12px 20px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:var(--transition);font-family:var(--font);border:none;background:transparent}
.tab:hover{color:var(--text-secondary);background:var(--accent-subtle)}
.tab.active{color:var(--accent);background:var(--accent-glow);box-shadow:0 0 15px var(--accent-glow)}
.tab .tab-icon{display:block;font-size:18px;margin-bottom:4px}
.tab-score{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;font-family:var(--font-mono);vertical-align:middle}
.tab-score.high{background:var(--green-subtle);color:var(--green)}
.tab-score.medium{background:var(--amber-subtle);color:var(--amber)}
.tab-score.low{background:var(--red-subtle);color:var(--red)}

/* Tab Content */
.tab-content{display:none;animation:fadeIn .35s ease}
.tab-content.active{display:block}
.dimension-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:24px}
.dim-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:var(--transition)}
.dim-card:hover{transform:translateY(-1px);border-color:var(--border-light)}
.dim-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dim-card-label{font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.dim-card-value{font-size:24px;font-weight:700;font-family:var(--font-mono)}
.dim-card-value.high{color:var(--green)}
.dim-card-value.medium{color:var(--amber)}
.dim-card-value.low{color:var(--red)}
.dim-bar{height:4px;border-radius:2px;background:var(--bg-elevated);margin-bottom:12px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.dim-bar-fill.high{background:linear-gradient(90deg,var(--green),#00e89b)}
.dim-bar-fill.medium{background:linear-gradient(90deg,var(--amber),#f5c800)}
.dim-bar-fill.low{background:linear-gradient(90deg,var(--red),#ff6b7a)}
.dim-details{list-style:none;padding:0}
.dim-details li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(30,45,82,0.3);font-size:13px}
.dim-details li:last-child{border-bottom:none}
.dim-details .d-label{color:var(--text-secondary)}
.dim-details .d-value{color:var(--text-primary);font-weight:500;font-family:var(--font-mono);font-size:12px}

/* Score Ring */
.score-ring-wrap{display:flex;align-items:center;justify-content:center;gap:32px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px}
.score-ring{position:relative;width:120px;height:120px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--bg-elevated);stroke-width:8}
.score-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.score-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring-text .num{font-size:32px;font-weight:800;font-family:var(--font-mono);line-height:1}
.score-ring-text .lbl{font-size:10px;color:var(--text-muted);margin-top:2px}
.score-ring-legend{display:flex;flex-direction:column;gap:10px}
.score-ring-legend-item{display:flex;align-items:center;gap:10px;font-size:13px}
.score-ring-legend-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.score-ring-legend-item .lbl{color:var(--text-secondary);min-width:70px}
.score-ring-legend-item .val{font-family:var(--font-mono);font-weight:600;font-size:14px}

/* Syllabus Button */
.btn-syllabus{display:inline-flex;align-items:center;gap:6px;background:var(--blue-subtle);border:1px solid rgba(74,125,255,0.3);color:var(--blue);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font)}
.btn-syllabus:hover{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 16px rgba(74,125,255,0.3)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(7,11,20,0.75);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg-card);border:1px solid var(--border-light);border-radius:16px;width:90%;max-width:680px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.6);transform:scale(0.92) translateY(20px);transition:transform .35s cubic-bezier(0.4,0,0.2,1)}
.modal-overlay.show .modal{transform:scale(1) translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-header-left{display:flex;align-items:center;gap:12px}
.modal-icon{width:36px;height:36px;border-radius:8px;background:var(--blue-subtle);display:flex;align-items:center;justify-content:center;font-size:18px}
.modal-title{font-size:16px;font-weight:700;color:var(--text-primary)}
.modal-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);font-size:16px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--red-subtle);color:var(--red);border-color:var(--red)}
.modal-body{padding:24px 28px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-track{background:var(--bg-surface);border-radius:3px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
.syllabus-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.syllabus-meta-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px}
.syllabus-meta-item .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.syllabus-meta-item .value{font-size:14px;font-weight:600;color:var(--text-primary)}
.syllabus-section{margin-bottom:20px}
.syllabus-section-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.syllabus-section-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
.syllabus-points{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.syllabus-points li{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);line-height:1.6;transition:var(--transition)}
.syllabus-points li:hover{border-color:var(--border-light);background:var(--bg-elevated)}
.syllabus-points li .point-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--accent-subtle);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.syllabus-objectives{display:flex;flex-wrap:wrap;gap:8px}
.syllabus-tag{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);padding:5px 12px;border-radius:16px;font-size:12px;font-weight:500}
.syllabus-source{margin-top:16px;padding:12px 16px;background:var(--blue-subtle);border:1px solid rgba(74,125,255,0.2);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.syllabus-source .src-icon{font-size:14px}

/* Responsive */
@media(max-width:900px){.app{padding:20px}.stats{grid-template-columns:1fr}.detail-top{flex-direction:column}.tabs{flex-wrap:wrap}.tab{flex:1 0 45%}.score-ring-wrap{flex-direction:column}.detail-session-info{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.app{padding:16px}.header{flex-direction:column;align-items:flex-start;gap:12px}.table-wrap{overflow-x:auto}.detail-session-info{grid-template-columns:1fr}.dimension-cards{grid-template-columns:1fr}.tab{flex:1 0 100%}}
</style>
</head>
<body>

<div class="app" id="app">

<!-- ========== MAIN PAGE ========== -->
<div class="page active" id="page-main">
  <header class="header">
    <div class="header-left">
      <div class="header-logo">AI</div>
      <div class="header-title">AI 监课系统 <span>· 后台看板</span></div>
    </div>
    <div class="header-date"><i>📅</i> <span id="today-display"></span></div>
  </header>

  <!-- Stats -->
  <div class="stats" id="stats-container">
    <div class="stat-card total">
      <div class="stat-label">总场次</div>
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-sub">今日 AI 监课场次</div>
      <div class="stat-icon">Σ</div>
    </div>
    <div class="stat-card passed">
      <div class="stat-label">及格</div>
      <div class="stat-value" id="stat-passed">0</div>
      <div class="stat-sub">综合评分 &ge; 60 分</div>
      <div class="stat-icon">✓</div>
    </div>
    <div class="stat-card failed">
      <div class="stat-label">不及格</div>
      <div class="stat-value" id="stat-failed">0</div>
      <div class="stat-sub">综合评分 &lt; 60 分</div>
      <div class="stat-icon">✗</div>
    </div>
  </div>

  <!-- Session List -->
  <div class="section-header">
    <div class="section-title">直播场次列表 <span class="count" id="list-count">0</span></div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="pass">及格</button>
      <button class="filter-btn" data-filter="fail">不及格</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>场次 ID</th>
          <th>直播间标题</th>
          <th>授课老师</th>
          <th>直播时间</th>
          <th>负责运营</th>
          <th>最终评分</th>
          <th>状态</th>
          <th style="text-align:center">操作</th>
        </tr>
      </thead>
      <tbody id="session-table-body"></tbody>
    </table>
  </div>
</div>

<!-- ========== DETAIL PAGE ========== -->
<div class="page" id="page-detail">
  <div class="detail-header">
    <div class="detail-top">
      <button class="btn-back" onclick="showPage('main')">← 返回看板</button>
      <div style="font-size:18px;font-weight:700" id="detail-title">场次详情</div>
    </div>
    <div class="detail-session-info" id="detail-info"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="attendance" id="tab-attendance"><span class="tab-icon">⏰</span>出勤情况</button>
    <button class="tab" data-tab="professionalism" id="tab-professionalism"><span class="tab-icon">📚</span>授课专业度</button>
    <button class="tab" data-tab="engagement" id="tab-engagement"><span class="tab-icon">💬</span>课堂活跃度</button>
    <button class="tab" data-tab="software" id="tab-software"><span class="tab-icon">🖥️</span>软件熟练度</button>
  </div>

  <!-- Tab Contents -->
  <div id="tab-contents">
    <div class="tab-content active" data-tab="attendance" id="content-attendance"></div>
    <div class="tab-content" data-tab="professionalism" id="content-professionalism"></div>
    <div class="tab-content" data-tab="engagement" id="content-engagement"></div>
    <div class="tab-content" data-tab="software" id="content-software"></div>
  </div>
</div>

<!-- ========== SYLLABUS MODAL ========== -->
<div class="modal-overlay" id="syllabus-modal" onclick="if(event.target===this)closeSyllabusModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-icon">📖</div>
        <div>
          <div class="modal-title" id="syllabus-modal-title">教纲详情</div>
          <div class="modal-subtitle" id="syllabus-modal-subtitle">本场直播对应教学大纲</div>
        </div>
      </div>
      <button class="modal-close" onclick="closeSyllabusModal()">✕</button>
    </div>
    <div class="modal-body" id="syllabus-modal-body"></div>
  </div>
</div>

</div>

<script>
// ========== DATA ==========

// ========== STATE ==========
let currentFilter = 'all';
let currentSession = null;

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('today-display').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
  renderMain();
  setupFilters();
  setupTabs();
});

// ========== MAIN PAGE ==========
function renderMain() {
  const filtered = SESSIONS.filter(s => {
    if (currentFilter === 'pass') return s.score >= 60;
    if (currentFilter === 'fail') return s.score < 60;
    return true;
  });

  const total = SESSIONS.length;
  const passed = SESSIONS.filter(s => s.score >= 60).length;
  const failed = SESSIONS.filter(s => s.score < 60).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-passed').textContent = passed;
  document.getElementById('stat-failed').textContent = failed;
  document.getElementById('list-count').textContent = filtered.length;

  const tbody = document.getElementById('session-table-body');
  tbody.innerHTML = filtered.map(s => {
    const badgeClass = s.score >= 80 ? 'pass' : s.score >= 60 ? 'warn' : 'fail';
    const statusClass = s.score >= 60 ? 'normal' : 'alert';
    const statusText = s.score >= 60 ? '正常' : '低分预警';
    return `<tr>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">${s.id}</td>
      <td><strong>${s.title}</strong></td>
      <td>${s.teacherName}</td>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)">${s.time}</td>
      <td>${s.operator}</td>
      <td><span class="score-badge ${badgeClass}"><span class="score-dot"></span>${s.score}</span></td>
      <td><span class="status-tag ${statusClass}">${statusText}</span></td>
      <td style="text-align:center"><button class="btn-detail" onclick="openDetail(${s.id})">查看明细</button></td>
    </tr>`;
  }).join('');
}

function setupFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderMain();
    });
  });
}

// ========== DETAIL PAGE ==========
function openDetail(id) {
  currentSession = SESSIONS.find(s => s.id === id);
  if (!currentSession) return;

  // Detail header info
  const s = currentSession;
  document.getElementById('detail-title').textContent = `场次 #${s.id} · ${s.title}`;
  document.getElementById('detail-info').innerHTML = `
    <div class="detail-info-item"><span class="label">授课老师</span><span class="value">${s.teacherName}</span></div>
    <div class="detail-info-item"><span class="label">直播时间</span><span class="value mono">${s.time}</span></div>
    <div class="detail-info-item"><span class="label">负责运营</span><span class="value">${s.operator}</span></div>
    <div class="detail-info-item"><span class="label">综合评分</span><span class="detail-score-large" style="color:${s.score>=80?'var(--green)':s.score>=60?'var(--amber)':'var(--red)'}">${s.score}<span class="score-unit">/100</span></span></div>
  `;

  // Update tab labels with dimension scores
  updateTabScores(s);
  renderAllTabContents(s);
  activateTab('attendance');

  showPage('detail');
}

function updateTabScores(s) {
  const dims = [
    {id:'tab-attendance', icon:'⏰', label:'出勤情况', score:s.attendance.score},
    {id:'tab-professionalism', icon:'📚', label:'授课专业度', score:s.professionalism.score},
    {id:'tab-engagement', icon:'💬', label:'课堂活跃度', score:s.engagement.score},
    {id:'tab-software', icon:'🖥️', label:'软件熟练度', score:s.software.score}
  ];
  dims.forEach(d => {
    const cls = d.score >= 80 ? 'high' : d.score >= 60 ? 'medium' : 'low';
    document.getElementById(d.id).innerHTML = `<span class="tab-icon">${d.icon}</span>${d.label}<span class="tab-score ${cls}">${d.score}分</span>`;
  });
}

function renderAllTabContents(s) {

  document.getElementById('content-attendance').innerHTML = `
    <div class="dimension-cards">

        <div class="dim-bar"><div class="dim-bar-fill ${aClass}" style="width:${a.score}%"></div></div>

          <li><span class="d-label">早退</span><span class="d-value">${a.early > 0 ? a.early + ' 分钟 (扣' + (a.early*2) + '分)' : '无'}</span></li>
          <li><span class="d-label">扣分合计</span><span class="d-value" style="color:${a.deduction > 0 ? 'var(--red)' : 'var(--green)'}">${a.deduction} 分</span></li>
          <li><span class="d-label">结论</span><span class="d-value" style="color:${a.score >= 80 ? 'var(--green)' : 'var(--red)'}">${a.detail}</span></li>
        </ul>

    </div>`;

  // Professionalism

  const pClass = p.score >= 80 ? 'high' : p.score >= 60 ? 'medium' : 'low';

        <div class="dim-bar"><div class="dim-bar-fill ${pClass}" style="width:${p.score}%"></div></div>
        <ul class="dim-details">
          <li><span class="d-label">知识点覆盖率</span><span class="d-value">${(p.coverage * 100).toFixed(0)}%</span></li>
          <li><span class="d-label">匹配知识点数</span><span class="d-value">${p.matched} 个</span></li>
          <li><span class="d-label">违规词命中</span><span class="d-value" style="color:${p.violations > 0 ? 'var(--red)' : 'var(--green)'}">${p.violations > 0 ? p.violations + ' 次 (扣' + (p.violations*5) + '分)' : '无'}</span></li>
          <li><span class="d-label">老师发言占比</span><span class="d-value">${(p.speakRatio * 100).toFixed(0)}%</span></li>
          <li><span class="d-label">综合评估</span><span class="d-value" style="color:${p.score >= 80 ? 'var(--green)' : 'var(--red)'}">${p.detail}</span></li>
        </ul>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn-syllabus" onclick="openSyllabusModal(${s.id})">📖 查看教纲</button>
        </div>
      </div>
    </div>`;

  // Engagement
  const e = s.engagement;
  const eClass = e.score >= 80 ? 'high' : e.score >= 60 ? 'medium' : 'low';
  document.getElementById('content-engagement').innerHTML = `
    <div class="dimension-cards">
      <div class="dim-card">
        <div class="dim-card-header"><span class="dim-card-label">活跃度得分</span><span class="dim-card-value ${eClass}">${e.score}</span></div>
        <div class="dim-bar"><div class="dim-bar-fill ${eClass}" style="width:${e.score}%"></div></div>
        <ul class="dim-details">
          <li><span class="d-label">学生评论数</span><span class="d-value">${e.comments} 条</span></li>
          <li><span class="d-label">学生发言数</span><span class="d-value">${e.speaks} 次</span></li>
          <li><span class="d-label">老师提问次数</span><span class="d-value">${e.questions} 次 (加${Math.min(e.questions*2,20)}分)</span></li>

  document.getElementById('content-software').innerHTML = `

      <div class="dim-card">

          <li><span class="d-label">异常事件</span><span class="d-value" style="color:${sw.abnormal > 0 ? 'var(--red)' : 'var(--green)'}">${sw.abnormal > 0 ? sw.abnormal + ' 次' : '无'}</span></li>
          <li><span class="d-label">备注</span><span class="d-value">${sw.note || '正常'}</span></li>
          <li><span class="d-label">综合评估</span><span class="d-value" style="color:${sw.score >= 80 ? 'var(--green)' : 'var(--red)'}">${sw.score >= 80 ? '操作熟练，符合要求' : '需关注软件操作问题'}</span></li>

// ========== TABS ==========
function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activateTab(tab.dataset.tab);
    });
  });
}

function activateTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.dataset.tab === name));
}

// ========== NAVIGATION ==========
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
}

// ========== SYLLABUS MODAL ==========
function openSyllabusModal(sessionId) {
  const syllabus = SYLLABUS_DATA[sessionId];
  if (!syllabus) return;

  const session = SESSIONS.find(s => s.id === sessionId);
  document.getElementById('syllabus-modal-title').textContent = `教纲 · 第${syllabus.order}讲`;
  document.getElementById('syllabus-modal-subtitle').textContent = syllabus.section;

  const keyPointsHtml = syllabus.keyPoints.map((pt, i) => 
    `<li><span class="point-num">${i + 1}</span><span>${pt}</span></li>`
  ).join('');

  const objectivesHtml = syllabus.objectives.map(o => 
    `<span class="syllabus-tag">🎯 ${o}</span>`
  ).join('');

  const methodsHtml = syllabus.methods.map(m => 
    `<span class="syllabus-tag">📋 ${m}</span>`
  ).join('');

  document.getElementById('syllabus-modal-body').innerHTML = `
    <div class="syllabus-meta">
      <div class="syllabus-meta-item">
        <div class="label">章节序号</div>
        <div class="value">第 ${syllabus.order} 讲 / 共 10 讲</div>
      </div>
      <div class="syllabus-meta-item">
        <div class="label">要求时长</div>
        <div class="value">${syllabus.requiredDuration}</div>
      </div>
      <div class="syllabus-meta-item">
        <div class="label">教学课件</div>
        <div class="value">${syllabus.courseware}</div>
      </div>
    </div>

    <div class="syllabus-section">
      <div class="syllabus-section-title">核心知识点</div>
      <ul class="syllabus-points">${keyPointsHtml}</ul>
    </div>

    <div class="syllabus-section">
      <div class="syllabus-section-title">教学目标</div>
      <div class="syllabus-objectives">${objectivesHtml}</div>
    </div>

    <div class="syllabus-section">
      <div class="syllabus-section-title">教学方法</div>
      <div class="syllabus-objectives">${methodsHtml}</div>
    </div>

    <div class="syllabus-source">
      <span class="src-icon">🔗</span>
      <span>数据来源：飞书多维表格 · AI 监课系统 · 教纲大纲表（测试数据）</span>
    </div>
  `;

  document.getElementById('syllabus-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeSyllabusModal() {
  document.getElementById('syllabus-modal').classList.remove('show');
  document.body.style.overflow = '';
}

// ESC key to close modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSyllabusModal();
});
</script>
</body>
